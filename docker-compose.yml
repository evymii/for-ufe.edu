# Local infrastructure: MongoDB for development and for tests.
# Start with:  docker compose up -d
# Stop with:    docker compose down          (keep data)
# Wipe data:    docker compose down -v       (destroys volumes)
#
# Host ports are 27018 (dev) and 27019 (test) so they never clash with a
# mongod already running locally on the default 27017.
#
# Both instances run as single-node replica sets: Prisma's multi-document
# transactions (content-block writes) require a replica set, even locally.
# MongoDB requires a keyfile when auth is combined with a replica set, so
# each container generates one into its volume on first boot (single-node —
# the key never has to be shared). The healthcheck initiates the replica
# set on first boot.

x-mongo-command: &mongo-command >
  bash -c
  "if [ ! -f /data/db/mongo-keyfile ]; then openssl rand -base64 756 > /data/db/mongo-keyfile; fi &&
   chmod 400 /data/db/mongo-keyfile &&
   chown mongodb:mongodb /data/db/mongo-keyfile &&
   exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/db/mongo-keyfile --bind_ip_all"

services:
  mongo:
    image: mongo:8
    container_name: ufeedu-mongo-dev
    restart: unless-stopped
    command: *mongo-command
    environment:
      MONGO_INITDB_ROOT_USERNAME: ufeedu
      MONGO_INITDB_ROOT_PASSWORD: ufeedu
      MONGO_INITDB_DATABASE: ufeedu_dev
    ports:
      - "27018:27017"
    volumes:
      - mongodata_dev:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "ufeedu",
          "-p",
          "ufeedu",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate().ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 12

  mongo-test:
    image: mongo:8
    container_name: ufeedu-mongo-test
    restart: unless-stopped
    command: *mongo-command
    environment:
      MONGO_INITDB_ROOT_USERNAME: ufeedu
      MONGO_INITDB_ROOT_PASSWORD: ufeedu
      MONGO_INITDB_DATABASE: ufeedu_test
    ports:
      - "27019:27017"
    volumes:
      - mongodata_test:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "ufeedu",
          "-p",
          "ufeedu",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate().ok }",
        ]
      interval: 5s
      timeout: 10s
      retries: 12

volumes:
  mongodata_dev:
  mongodata_test:
